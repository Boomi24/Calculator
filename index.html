<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <center>
        <h1>CALCULATOR</h1>
        <div id="calculator-outline">
            <input id="input-space" placeholder="Enter a number">
            <div id="number-pad">
                <table>
                    <tr>
                        <td></td>
                        <td></td>
                        <td><button onclick="backSpace()" class="operator-btn">⬅</button></td>
                        <td><button onclick="clearDisplay()" class="operator-btn">AC</button></td>                    </tr>
                    <tr>
                        <td><button onclick="clicking('1')">1</button></td>
                        <td><button onclick="clicking('2')">2</button></td>
                        <td><button onclick="clicking('3')">3</button></td>
                        <td><button onclick="clicking('/')" class="operator-btn">/</button></td>
                    </tr>
                    <tr>
                        <td><button onclick="clicking('4')">4</button></td>
                        <td><button onclick="clicking('5')">5</button></td>
                        <td><button onclick="clicking('6')">6</button></td>
                        <td><button onclick="clicking('*')" class="operator-btn">*</button></td>
                    </tr>
                    <tr>
                        <td><button onclick="clicking('7')">7</button></td>
                        <td><button onclick="clicking('8')">8</button></td>
                        <td><button onclick="clicking('9')">9</button></td>
                        <td><button onclick="clicking('-')" class="operator-btn">-</button></td>
                    </tr>
                    <tr>
                        <td><button onclick="clicking('.')">.</button></td>
                        <td><button onclick="clicking('0')">0</button></td>
                        <td><button id="result-btn" onclick="result()">=</button></td>
                        <td><button onclick="clicking('+')" class="operator-btn">+</button></td>
                    </tr>
                </table>
            </div>
        </div>
    </center>
    <script src="script.js"></script>
</body>
</html>
